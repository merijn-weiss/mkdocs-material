name: build

on:
  push:
    branches:
      - master
      - "mondrian-*"
  pull_request:
  release:
    types:
      - published

env:
  NODE_VERSION: 24.x
  PYTHON_VERSION: 3.x
  IMAGE_NAME: ghcr.io/merijn-weiss/mondrian-docs

permissions:
  contents: read
  packages: write

jobs:
  npm-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js runtime
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Node.js dependencies
        run: npm ci

      - name: Build project
        run: |
          npm run build
          git diff --name-only

  npm-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js runtime
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Node.js dependencies
        run: npm ci

      - name: Check project
        run: npm run check

  python:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Set up Python dependencies
        run: python -m pip install --upgrade build twine

      - name: Build Python package
        run: python -m build

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=auto

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'release' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          load: ${{ github.event_name != 'release' }}
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      #- name: Check Docker image
      #  if: github.event_name != 'release'
      #  working-directory: /tmp
      #  run: |
      #    docker run --rm -i -v ${PWD}:/docs ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} new .
      #    docker run --rm -i -v ${PWD}:/docs ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} build

      - name: Check manifest
        if: github.event_name == 'release'
        run: |
          docker buildx imagetools inspect \
            "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"

      - name: Inspect image
        if: github.event_name == 'release'
        run: |
          docker pull "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"
          docker image inspect "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"
